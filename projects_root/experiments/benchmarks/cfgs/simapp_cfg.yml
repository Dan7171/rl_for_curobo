
gui_mode:
  enable_gpu_dynamics: True
  init_app_settings:
    headless: False # set 'false' to show GUI
    width: 800 # 280
    height: 600 # 720
    window_width: 1920
    window_height: 1080
    # width: "1920"
    # height: "1080"
    physics_dt: 0.0333 # 0.03 # 0.016666666666666666 # 0.016666666666666666
    rendering_dt: 0.0333 # 0.03 # 0.016666666666666666 # 0.016666666666666666
    backend: "torch"
    
livestream_mode:
  enable_gpu_dynamics: True
  init_app_settings:
    width: 1280
    height: 720
    window_width: 1920
    window_height: 1080
    headless: True
    hide_ui: False
    renderer: "RaytracedLighting"
    display_options: 3286

headless_mode:
  enable_gpu_dynamics: True
  init_app_settings:
    # width: 1280
    # height: 720
    # window_width: 1920
    # window_height: 1080
    # headless: True
    # hide_ui: True
    # renderer: "RaytracedLighting"
    # # display_options: 3286

    headless: True
    no_window: True           # same as --no-window
    renderer: "None"          # skip RTX entirely if you don’t render
    "/renderer/multiGpu/enabled": False
    "/rtx/enabled": False
    "/rtx/hydra/enabled": False
    "/app/renderer/active": "None"
    gpu_device: 0     
    audio_enabled: False
  